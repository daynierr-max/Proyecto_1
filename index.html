
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luz Fácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ocultar barra de desplazamiento manteniendo la funcionalidad de scroll */
        * {
            -ms-overflow-style: none;  /* Internet Explorer y Edge */
            scrollbar-width: none;  /* Firefox */
        }
        *::-webkit-scrollbar {
            display: none; /* Chrome, Safari y Opera */
        }

        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }

        /* React Transition Group - Cross Fade */
        .fade-enter {
            opacity: 0;
            transform: scale(0.95) translateY(5px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1), transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fade-exit {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .fade-exit-active {
            opacity: 0;
            transform: scale(1.05) translateY(-5px);
            transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1), transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Insight Fade */
        .insight-enter {
            opacity: 0;
        }
        .insight-enter-active {
            opacity: 1;
            transition: opacity 800ms ease-in;
        }
        .insight-exit {
            opacity: 1;
        }
        .insight-exit-active {
            opacity: 0;
            transition: opacity 400ms ease-out;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-transition-group": "https://esm.sh/react-transition-group@^4.4.5",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
